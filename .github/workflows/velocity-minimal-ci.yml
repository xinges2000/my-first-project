name: velocity-minimal-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  velocity-minimal-pytest:
    name: velocity minimal pytest gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run velocity minimal pytest gate
        run: |
          python -m pytest \
            tests/velocity/test_velocity_contract_schema.py \
            tests/velocity/test_build_velocity.py \
            tests/velocity/test_runtime_velocity_model.py \
            tests/velocity/test_traveltime_ready.py \
            -q -s --basetemp=.pytest_tmp
